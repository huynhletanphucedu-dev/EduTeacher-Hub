<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leo Núi – EduTeacher Hub</title>
<link rel="stylesheet" href="core.css">
<style>
body{background:linear-gradient(#0ea5e9,#bae6fd 70%,#e0f2fe)}
.wrap{position:fixed;left:0;right:0;top:48px;bottom:84px;display:flex;justify-content:center;align-items:flex-end}
.mt{position:relative;width:min(100%,calc((100vh - 132px) * 1000 / 600));aspect-ratio:1000/600}
.mt>svg{position:absolute;inset:0;width:100%;height:100%}
.cl{position:absolute;transform:translate(-50%,-100%);transition:left 1.1s cubic-bezier(.4,0,.3,1),top 1.1s cubic-bezier(.4,0,.3,1);z-index:5;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.cl .fl{font-size:.7rem;font-weight:900;color:#fff;background:var(--c);border-radius:6px;padding:1px 6px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.cl .p{width:clamp(28px,4.2vw,46px);height:clamp(28px,4.2vw,46px);border-radius:50%;background:var(--c);border:3px solid #fff;display:grid;place-items:center;font-size:clamp(16px,2.6vw,28px);box-shadow:0 4px 8px rgba(0,0,0,.35)}
.cl.jump .p{animation:jp .5s 2}
@keyframes jp{50%{transform:translateY(-14px)}}
.cl.slip .p{animation:sl .15s 6}
@keyframes sl{50%{transform:translateX(-6px) rotate(-15deg)}}
.bar{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:10px;align-items:center;z-index:10;flex-wrap:wrap;padding:0 10px}
.bar button{border:0;border-radius:16px;padding:13px 28px;font-size:clamp(1.05rem,2.8vw,1.35rem);font-weight:900;color:#fff;background:linear-gradient(#22c55e,#15803d);box-shadow:0 6px 0 #14532d}
.bar button:disabled{filter:grayscale(1);opacity:.6}
.bar .i{background:rgba(255,255,255,.9);border-radius:999px;padding:6px 14px;font-weight:800;color:#0c4a6e}
.snowf{position:fixed;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.8;animation:sn linear infinite;pointer-events:none}
@keyframes sn{to{transform:translate(30px,105vh)}}
</style>
</head>
<body>
<div class="wrap"><div class="mt" id="mt"></div></div>
<div class="bar"><span class="i" id="info"></span><button id="go">🧗 Câu hỏi tiếp theo</button></div>
<script src="../tienphong/js/bank-classic.js"></script>
<script src="../tienphong/js/math-fmt-classic.js"></script>
<script src="core.js"></script>
<script>
(async () => {
const { setup, askAll, tools, SFX, board, toast, podium, $, $$, esc, rnd, pick, shuffle, wait } = OT;
tools();
const { cfg, questions, teams } = await setup({
  id: "leonui", icon: "🏔️", title: "Leo Núi", teams: { min: 2, max: 6, def: 4 }, count: { def: 12, opts: [8, 12, 16, 20] },
  desc: "<b>Tất cả các đội cùng trả lời</b> mỗi câu (ghi ra bảng con hoặc giơ Thẻ Hiệp Sĩ). Thầy/cô hiện đáp án rồi bấm chọn các đội đúng – đội đúng leo lên 1 bậc. Gặp <b>🚡 cáp treo</b> được lên thêm, gặp <b>❄️ lở tuyết</b> bị trượt xuống. Đội cắm cờ trên đỉnh đầu tiên sẽ thắng!",
  bg: "linear-gradient(#0ea5e9,#e0f2fe)"
});
const B = board(teams);
const STEPS = Math.max(5, Math.min(questions.length, Math.round(questions.length * .7)));
// đường leo zíc zắc từ chân núi lên đỉnh
const P = []; for (let i = 0; i <= STEPS; i++) { const f = i / STEPS; const y = 560 - f * 470; const half = 380 * (1 - f) + 20; const side = i % 2 ? 1 : -1; P.push([500 + side * half * (.35 + .25 * ((i * 37) % 5) / 5) * (i === STEPS ? 0 : 1), y]); }
P[0] = [500, 575];
// ô sự kiện
const EV = {}; const cand = shuffle([...Array(STEPS - 2).keys()].map(i => i + 2));
EV[cand[0]] = "lift"; if (STEPS >= 7) EV[cand[1]] = "snow"; if (STEPS >= 10) EV[cand[2]] = cand[2] > STEPS / 2 ? "snow" : "lift";
const path = P.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ");
$("#mt").innerHTML = `<svg viewBox="0 0 1000 600"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#334155"/></linearGradient></defs>
  <path d="M-20 600 L170 300 L260 380 L380 160 L420 210 L500 60 L590 190 L640 150 L780 340 L860 280 L1020 600Z" fill="url(#g1)"/>
  <path d="M-20 600 L120 420 L220 520 L330 400 L1000 600Z" fill="url(#g2)" opacity=".7"/>
  <path d="M500 60 L548 128 L530 122 L515 140 L500 120 L480 138 L466 120 L452 128Z" fill="#fff"/>
  <path d="M380 160 L398 186 L388 184 L378 194 L366 182Z" fill="#fff"/><path d="M640 150 L660 176 L648 174 L640 184 L628 172Z" fill="#fff"/>
  <path d="M0 600 L1000 600 L1000 560 Q750 530 500 570 Q250 535 0 565Z" fill="#16a34a"/>
  ${[80, 160, 840, 930].map(x => `<path d="M${x} 575 l-22 0 l22 -48 l22 48Z" fill="#166534"/><rect x="${x - 4}" y="575" width="8" height="12" fill="#78350f"/>`).join("")}
  <path d="${path}" fill="none" stroke="#fef3c7" stroke-width="7" stroke-dasharray="2 12" stroke-linecap="round"/>
  ${P.map((p, i) => i === 0 ? "" : i === STEPS ? `<g transform="translate(${p[0]} ${p[1]})"><line x1="0" y1="0" x2="0" y2="-52" stroke="#78350f" stroke-width="4"/><path d="M0 -52 L36 -42 L0 -32Z" fill="#ef4444"><animate attributeName="d" values="M0 -52 L36 -42 L0 -32Z;M0 -52 L34 -38 L0 -32Z;M0 -52 L36 -42 L0 -32Z" dur="1s" repeatCount="indefinite"/></path><text x="0" y="20" text-anchor="middle" font-size="20" font-weight="900" fill="#fff" stroke="#0f172a" stroke-width="4" paint-order="stroke">ĐỈNH</text></g>`
    : `<g transform="translate(${p[0]} ${p[1]})"><circle r="17" fill="${EV[i] === "lift" ? "#22c55e" : EV[i] === "snow" ? "#38bdf8" : "#fff"}" stroke="#0f172a" stroke-width="3"/><text y="7" text-anchor="middle" font-size="${EV[i] ? 20 : 17}" font-weight="900" fill="#0f172a">${EV[i] === "lift" ? "🚡" : EV[i] === "snow" ? "❄️" : i}</text></g>`).join("")}
  <text x="500" y="596" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">CHÂN NÚI</text></svg>`;
for (let i = 0; i < 40; i++) { const s = document.createElement("i"); s.className = "snowf"; s.style.left = rnd(0, 100) + "vw"; s.style.animationDuration = rnd(6, 14) + "s"; s.style.animationDelay = -rnd(0, 14) + "s"; document.body.appendChild(s); }
const AV = ["🧗", "🧗‍♀️", "🐐", "🦊", "🐻", "🐧"];
teams.forEach((t, i) => { t.pos = 0; const d = document.createElement("div"); d.className = "cl"; d.style.setProperty("--c", t.color); d.innerHTML = `<span class="fl">${esc(t.name)}</span><span class="p">${AV[i]}</span>`; $("#mt").appendChild(d); t.el = d; });
function place() {
  const groups = {}; teams.forEach(t => (groups[t.pos] = groups[t.pos] || []).push(t));
  Object.entries(groups).forEach(([pos, arr]) => arr.forEach((t, j) => { const p = P[+pos]; const off = (j - (arr.length - 1) / 2) * 34; t.el.style.left = (p[0] + off) / 10 + "%"; t.el.style.top = (p[1] - 6) / 6 + "%"; }));
  teams.forEach(t => t.score = t.pos);
  B.draw(-1); $("#info").innerHTML = `Câu ${Math.min(qi + 1, questions.length)}/${questions.length} · Đỉnh núi: bậc ${STEPS}`;
}
let qi = 0, over = false;
async function round() {
  if (over) return; $("#go").disabled = true;
  const q = questions[qi];
  const ok = await askAll(q, { title: `🏔️ Câu ${qi + 1}/${questions.length}`, teams, timer: cfg.timer });
  qi++;
  if (!ok.length) toast("Chưa đội nào đúng – cùng cố gắng câu sau! 💪", "#0f172a");
  ok.forEach(i => { const t = teams[i]; t.pos = Math.min(STEPS, t.pos + 1); t.el.classList.add("jump"); setTimeout(() => t.el.classList.remove("jump"), 1000); });
  if (ok.length) SFX.ok(); place(); await wait(1200);
  for (const i of ok) {
    const t = teams[i], e = EV[t.pos];
    if (e === "lift" && t.pos < STEPS) { toast(`🚡 ${esc(t.name)} đi cáp treo: lên thêm 1 bậc!`, "#16a34a"); SFX.win(); t.pos = Math.min(STEPS, t.pos + 1); place(); await wait(1300); }
    else if (e === "snow") { toast(`❄️ Lở tuyết! ${esc(t.name)} trượt xuống 1 bậc`, "#0369a1"); SFX.bad(); t.el.classList.add("slip"); t.pos = Math.max(0, t.pos - 1); place(); await wait(1300); t.el.classList.remove("slip"); }
  }
  const top = teams.filter(t => t.pos >= STEPS);
  if (top.length || qi >= questions.length) {
    over = true; $("#go").disabled = true;
    if (top.length) toast(`🚩 ${top.map(t => esc(t.name)).join(", ")} đã lên tới đỉnh!`, "#dc2626");
    setTimeout(() => podium(teams, { title: top.length ? "🚩 Chinh phục đỉnh núi!" : "🏆 Kết quả leo núi", sub: "Điểm = số bậc đã leo" }), 1600);
    return;
  }
  $("#go").disabled = false;
}
$("#go").onclick = round;
addEventListener("keydown", e => { if ((e.key === "Enter" || e.code === "Space") && !document.querySelector(".ot-q,.ot-end") && !$("#go").disabled) { e.preventDefault(); round(); } });
place();
})();
</script>
</body>
</html>
