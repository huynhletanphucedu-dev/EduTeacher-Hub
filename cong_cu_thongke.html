<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thống Kê Điểm – EduTeacher Hub</title>
<link rel="stylesheet" href="eduhub_ui.css">
<script src="eduhub_data.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<style>
:root{--accent:#2a78d6;
  --surface-1:#ffffff;--grid:#e5e7eb;--t1:#0b0b0b;--t2:#52514e;--t3:#78776f;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
  --o0:#86b6ef;--o1:#3987e5;--o2:#256abf;--o3:#104281}
body.dark{--surface-1:#1e293b;--grid:#334155;--t1:#f0efec;--t2:#c3c2b7;--t3:#9a998f;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
  --o0:#256abf;--o1:#3987e5;--o2:#6da7ec;--o3:#b7d3f6}
.ds{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--card2)}
.ds label{display:flex;gap:8px;align-items:center;font-size:.84rem;text-transform:none;font-weight:500;color:var(--text);letter-spacing:0}
.chart{position:relative;background:var(--surface-1)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:'Segoe UI',system-ui,sans-serif}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--t2);margin:6px 0 2px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.tip{position:absolute;pointer-events:none;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:.78rem;box-shadow:0 6px 20px rgba(0,0,0,.15);white-space:nowrap;z-index:5;display:none}
.tip b{font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lowlist{font-size:.84rem;line-height:1.7}
</style>
</head>
<body>
<div class="top">
  <h1>📈 Thống kê điểm &amp; phổ điểm <small>báo cáo tổ chuyên môn, họp phụ huynh</small></h1>
  <div class="right"><span class="privacy">🔒 Tính toán trên máy</span><a class="back" href="dashboard.html">← Trang chính</a></div>
</div>
<div class="wrap">
  <div class="card noprint">
    <div class="tabs" style="margin-bottom:12px"><button class="tab on" data-src="book">📒 Từ Sổ điểm</button><button class="tab" data-src="paste">📋 Dán từ Excel</button></div>
    <div id="src-book">
      <div class="row">
        <div class="f"><label>Chọn sổ điểm (có thể chọn nhiều lớp để so sánh)</label><div class="ds" id="books"></div></div>
        <div class="f s"><label>Cột điểm</label><select id="col"><option value="tbm">ĐTB môn</option><option value="gk">Giữa kỳ</option><option value="ck">Cuối kỳ</option></select></div>
        <div class="f s"><label>Học kỳ</label><select id="hk"><option value="hk1">Học kỳ I</option><option value="hk2">Học kỳ II</option><option value="cn">Cả năm</option></select></div>
      </div>
    </div>
    <div id="src-paste" hidden>
      <p class="hint">Dán bảng từ Excel: <b>dòng đầu là tiêu đề</b>, cột đầu là họ tên, mỗi cột điểm phía sau được tính là một nhóm (ví dụ mỗi cột là một lớp, hoặc mỗi cột là một bài kiểm tra).</p>
      <textarea id="paste" rows="6" style="margin-top:8px" placeholder="Họ và tên	6/4	6/5&#10;Nguyễn Văn An	8.5	7&#10;Trần Thị Bình	6	9.25"></textarea>
      <button class="btn" id="usepaste" style="margin-top:8px">📊 Thống kê</button>
    </div>
  </div>

  <div id="out"></div>
</div>
<div class="tip" id="tip"></div>
<script>
'use strict';
const {$, $$, esc} = ED;
const BANDS=[{k:'C',lb:'Chưa đạt (< 5,0)',min:-1,max:5},{k:'D',lb:'Đạt (5,0 – 6,4)',min:5,max:6.5},{k:'K',lb:'Khá (6,5 – 7,9)',min:6.5,max:8},{k:'T',lb:'Tốt (≥ 8,0)',min:8,max:11}];
const css=v=>getComputedStyle(document.body).getPropertyValue(v).trim();
const fmt=(x,d=1)=>x==null||isNaN(x)?'—':x.toFixed(d).replace('.',',');
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
let SETS=[], src='book';

/* ── nguồn ── */
function renderBooks(){
  const bs=ED.books(),sel=ED.get('tk_books',null);
  $('#books').innerHTML=bs.length?bs.map((b,i)=>`<label><input type="checkbox" value="${i}" ${(sel?sel.includes(i):i===0)?'checked':''}>${esc(b.mon)} – Lớp ${esc(b.lop)}${b.namhoc?' ('+esc(b.namhoc)+')':''}</label>`).join(''):'<span class="hint">Chưa có sổ điểm. Vào <b>Giảng Dạy → Sổ Điểm Cá Nhân</b> để tạo, hoặc dùng tab “Dán từ Excel”.</span>';
  $$('#books input').forEach(c=>c.onchange=()=>{ED.set('tk_books',$$('#books input:checked').map(x=>+x.value));fromBooks()});
}
function fromBooks(){
  const bs=ED.books(),ids=$$('#books input:checked').map(x=>+x.value),col=$('#col').value,hk=$('#hk').value;
  SETS=ids.map(i=>{const b=bs[i],sc=ED.bookScores(b,hk==='cn'&&col!=='tbm'?'hk2':hk);
    return {name:'Lớp '+b.lop+(ids.length>1&&new Set(ids.map(j=>bs[j].mon)).size>1?' – '+b.mon:''),mon:b.mon,list:sc.map(s=>({ten:s.ten,v:col==='tbm'?s.tbm:ED.num(s[col])}))}});
  render();
}
function fromPaste(){
  const t=ED.parseTable($('#paste').value);if(t.length<2){ED.toast('⚠️ Cần dòng tiêu đề và ít nhất 1 dòng điểm');return}
  const h=t[0];SETS=h.slice(1).map((n,j)=>({name:n||('Cột '+(j+2)),list:t.slice(1).map(r=>({ten:r[0],v:ED.num(r[j+1])}))})).filter(s=>s.list.some(x=>x.v!=null));
  ED.set('tk_paste',$('#paste').value);render();
}
$$('[data-src]').forEach(b=>b.onclick=()=>{src=b.dataset.src;$$('[data-src]').forEach(x=>x.classList.toggle('on',x===b));$('#src-book').hidden=src!=='book';$('#src-paste').hidden=src!=='paste';if(src==='book')fromBooks();else{$('#paste').value=ED.get('tk_paste','');if($('#paste').value)fromPaste();else{SETS=[];render()}}});
$('#col').onchange=fromBooks;$('#hk').onchange=fromBooks;$('#usepaste').onclick=fromPaste;

/* ── thống kê ── */
function stats(set){
  const v=set.list.map(x=>x.v).filter(x=>x!=null).sort((a,b)=>a-b),n=v.length;
  if(!n) return {n:0,miss:set.list.length};
  const mean=v.reduce((a,b)=>a+b,0)/n,med=n%2?v[(n-1)/2]:(v[n/2-1]+v[n/2])/2,sd=Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/n);
  const bands=BANDS.map(B=>v.filter(x=>x>=B.min&&x<B.max).length);
  const bins=Array.from({length:10},(_,i)=>v.filter(x=>i===9?x>=9:x>=i&&x<i+1).length);
  return {n,miss:set.list.length-n,mean,med,sd,max:v[n-1],min:v[0],bands,bins,tren5:v.filter(x=>x>=5).length,duoi35:v.filter(x=>x<3.5).length};
}

/* ── biểu đồ ── */
const SER=['--s1','--s2','--s3','--s4'], ORD=['--o0','--o1','--o2','--o3'];
function tipOn(el,html,e){const t=$('#tip');t.innerHTML=html;t.style.display='block';const r=el.closest('.chart').getBoundingClientRect(),w=t.offsetWidth;let x=e.clientX-r.left+14;if(x+w>r.width)x=e.clientX-r.left-w-14;t.style.left=(r.left+scrollX+x)+'px';t.style.top=(e.clientY+scrollY-12)+'px'}
function tipOff(){$('#tip').style.display='none'}
function hist(sets,st){
  const W=620,H=300,L=36,R=6,T=28,B=40,cw=(W-L-R)/10,k=sets.length,yMax=Math.max(1,...st.flatMap(s=>s.bins||[]));
  const nice=Math.max(1,Math.ceil(yMax/4)),top=nice*4,y=v=>T+(H-T-B)*(1-v/top);
  const bw=Math.min(24,(cw-10-(k-1)*2)/k);
  let g='';for(let i=0;i<=4;i++){const v=nice*i;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${css('--grid')}" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="${css('--t3')}">${v}</text>`}
  let bars='';
  for(let i=0;i<10;i++){const gx=L+cw*i+(cw-(k*bw+(k-1)*2))/2;
    g+=`<text x="${L+cw*i+cw/2}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="${css('--t2')}">${i===9?'9–10':i+'–'+(i+1)}</text>`;
    sets.forEach((s,j)=>{const c=st[j].bins?st[j].bins[i]:0;if(!c)return;const x=gx+j*(bw+2),yy=y(c),h=H-B-yy,r=Math.min(4,h);
      bars+=`<path d="M${x},${H-B} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${H-B} Z" fill="${css(SER[j])}" data-tip="${esc(s.name)}: <b>${c}</b> HS có điểm ${i===9?'9 – 10':i+' – dưới '+(i+1)} (${fmt(pct(c,st[j].n))}%)"/>`;
      bars+=`<rect x="${x-2}" y="${T}" width="${bw+4}" height="${H-B-T}" fill="transparent" data-tip="${esc(s.name)}: <b>${c}</b> HS có điểm ${i===9?'9 – 10':i+' – dưới '+(i+1)} (${fmt(pct(c,st[j].n))}%)"/>`;
      if(k===1&&h>0) bars+=`<text x="${x+bw/2}" y="${yy-5}" text-anchor="middle" font-size="11" font-weight="600" fill="${css('--t2')}">${c}</text>`;
    })}
  g+=`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="${css('--t3')}" stroke-width="1"/><text x="${(W+L)/2}" y="${H-4}" text-anchor="middle" font-size="11" fill="${css('--t3')}">Khoảng điểm</text><text x="4" y="${T-12}" font-size="11" fill="${css('--t3')}">Số HS</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Phổ điểm">${g}${bars}</svg>`;
}
function stacked(sets,st){
  const W=560,rowH=40,L=90,R=56,H=sets.length*rowH+20,bw=W-L-R;let g='';
  sets.forEach((s,j)=>{const S=st[j];if(!S.n)return;const yy=10+j*rowH;let x=L;
    g+=`<text x="${L-10}" y="${yy+17.5}" text-anchor="end" font-size="13" fill="${css('--t1')}">${esc(s.name)}</text>`;
    S.bands.forEach((c,bi)=>{if(!c)return;const w=bw*c/S.n-2;const p=pct(c,S.n),col=css(ORD[bi]),dark=bi>=2!==document.body.classList.contains('dark');
      g+=`<rect x="${x}" y="${yy}" width="${Math.max(1,w)}" height="26" rx="4" fill="${col}" data-tip="${esc(s.name)} · ${BANDS[bi].lb}: <b>${c}</b> HS (${fmt(p)}%)"/>`;
      const lbl=fmt(p,0)+'%';if(w>lbl.length*7+10)g+=`<text x="${x+w/2}" y="${yy+17.5}" text-anchor="middle" font-size="12" font-weight="600" fill="${dark?'#ffffff':'#0b0b0b'}" pointer-events="none">${lbl}</text>`;
      x+=w+2});
    g+=`<text x="${W-R+8}" y="${yy+17.5}" font-size="12" fill="${css('--t2')}">${S.n} HS</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tỉ lệ theo mức">${g}</svg>`;
}

/* ── hiển thị ── */
function render(){
  if(!SETS.length){$('#out').innerHTML='<div class="empty">Chọn ít nhất một sổ điểm, hoặc dán bảng điểm từ Excel để xem thống kê.</div>';return}
  const st=SETS.map(stats),many=SETS.length>4,show=SETS.slice(0,4),sst=st.slice(0,4);
  const all={list:SETS.flatMap(s=>s.list)},A=stats(all);
  if(!A.n){$('#out').innerHTML=`<div class="empty">Sổ điểm đã chọn chưa có <b>${esc($('#col').selectedOptions[0].textContent)}</b> nào (${A.miss} học sinh). Điểm TB môn chỉ có khi đủ các cột TX, GK và CK — thử chọn cột khác hoặc học kỳ khác.</div>`;return}
  const kpi=(l,v,s)=>`<div class="stat"><span>${l}</span><b>${v}</b>${s?`<span style="text-transform:none">${s}</span>`:''}</div>`;
  const legend=(arr,vars)=>arr.length>1?`<div class="legend">${arr.map((n,i)=>`<span><i style="background:var(${vars[i]})"></i>${esc(n)}</span>`).join('')}</div>`:'';
  const rows=SETS.map((s,j)=>{const S=st[j];return S.n?`<tr><td><b>${esc(s.name)}</b></td><td class="n">${S.n}</td><td class="n">${fmt(S.mean,2)}</td><td class="n">${fmt(S.med)}</td><td class="n">${fmt(S.sd,2)}</td><td class="n">${fmt(S.max)}</td><td class="n">${fmt(S.min)}</td>${S.bands.slice().reverse().map(c=>`<td class="n">${c} <span class="hint">(${fmt(pct(c,S.n))}%)</span></td>`).join('')}<td class="n"><b>${fmt(pct(S.tren5,S.n))}%</b></td><td class="n">${S.duoi35}</td></tr>`:`<tr><td><b>${esc(s.name)}</b></td><td colspan="13" class="hint">Chưa có điểm</td></tr>`}).join('');
  const low=SETS.map(s=>({s,l:s.list.filter(x=>x.v!=null&&x.v<5).sort((a,b)=>a.v-b.v)})).filter(x=>x.l.length);
  $('#out').innerHTML=`
  <div class="card"><h2>📌 Tổng quan ${SETS.length>1?'('+SETS.length+' nhóm)':'– '+esc(SETS[0].name)}</h2>
    <div class="kpis" style="margin-top:10px">${kpi('Số học sinh có điểm',A.n,A.miss?A.miss+' em chưa có điểm':'')}${kpi('Điểm trung bình',fmt(A.mean,2),'trung vị '+fmt(A.med))}${kpi('Đạt từ 5,0 trở lên',fmt(pct(A.tren5,A.n))+'%',A.tren5+' học sinh')}${kpi('Mức Tốt (≥ 8,0)',fmt(pct(A.bands[3],A.n))+'%',A.bands[3]+' học sinh')}${kpi('Dưới 5,0',A.bands[0],fmt(pct(A.bands[0],A.n))+'% · '+A.duoi35+' em dưới 3,5')}</div></div>
  <div class="grid2">
    <div class="card"><h2>📊 Phổ điểm</h2><p class="hint">Số học sinh theo từng khoảng điểm${many?' · biểu đồ hiển thị 4 nhóm đầu, xem đủ ở bảng bên dưới':''}</p>${legend(show.map(s=>s.name),SER)}<div class="chart">${hist(show,sst)}</div></div>
    <div class="card"><h2>🎯 Tỉ lệ theo mức (TT22)</h2><p class="hint">Mức đánh giá theo ĐTB: Tốt ≥ 8,0 · Khá 6,5–7,9 · Đạt 5,0–6,4 · Chưa đạt &lt; 5,0</p><div class="legend">${BANDS.map((b,i)=>`<span><i style="background:var(${ORD[i]})"></i>${b.lb}</span>`).join('')}</div><div class="chart">${stacked(SETS,st)}</div></div>
  </div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>📋 Bảng thống kê</h2><div class="btns noprint"><button class="btn l" id="cp">📋 Sao chép bảng (dán vào Word/Excel)</button><button class="btn g" id="xl">⬇️ Xuất Excel</button><button class="btn l" id="pr">🖨️ In</button></div></div>
    <div class="tbl-wrap" style="margin-top:10px"><table class="tbl" id="stt"><thead><tr><th>Nhóm</th><th class="n">Sĩ số có điểm</th><th class="n">TB</th><th class="n">Trung vị</th><th class="n">Độ lệch chuẩn</th><th class="n">Cao nhất</th><th class="n">Thấp nhất</th><th class="n">Tốt</th><th class="n">Khá</th><th class="n">Đạt</th><th class="n">Chưa đạt</th><th class="n">≥ 5,0</th><th class="n">&lt; 3,5</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  ${low.length?`<div class="card"><h2>🤝 Học sinh cần quan tâm (dưới 5,0)</h2><div class="grid3" style="margin-top:8px">${low.map(x=>`<div class="lowlist"><b>${esc(x.s.name)}</b> (${x.l.length} em)<br>${x.l.map(y=>`${esc(y.ten)} – <b>${fmt(y.v)}</b>`).join('<br>')}</div>`).join('')}</div></div>`:''}`;
  $$('#out [data-tip]').forEach(el=>{el.addEventListener('mousemove',e=>tipOn(el,el.dataset.tip,e));el.addEventListener('mouseleave',tipOff)});
  $('#cp').onclick=()=>ED.copy(tableAOA(st).map(r=>r.join('\t')).join('\n')).then(()=>ED.toast('📋 Đã sao chép bảng thống kê'));
  $('#xl').onclick=()=>{const a2=[['Nhóm','Họ và tên','Điểm','Mức']];SETS.forEach(s=>s.list.forEach(x=>a2.push([s.name,x.ten,x.v==null?'':x.v,x.v==null?'':ED.LV[ED.level(x.v)]])));ED.exportXLSX([{name:'Thống kê',aoa:tableAOA(st)},{name:'Chi tiết',aoa:a2}],'ThongKeDiem_'+ED.fileName(SETS.map(s=>s.name).join('_')).slice(0,40))};
  $('#pr').onclick=()=>print();
}
function tableAOA(st){return [['Nhóm','Sĩ số có điểm','Điểm TB','Trung vị','Độ lệch chuẩn','Cao nhất','Thấp nhất','Tốt (SL)','Tốt (%)','Khá (SL)','Khá (%)','Đạt (SL)','Đạt (%)','Chưa đạt (SL)','Chưa đạt (%)','Từ 5,0 trở lên (%)','Dưới 3,5 (SL)'],...SETS.map((s,j)=>{const S=st[j];if(!S.n)return[s.name,0];const b=S.bands.slice().reverse();return[s.name,S.n,+S.mean.toFixed(2),S.med,+S.sd.toFixed(2),S.max,S.min,...b.flatMap(c=>[c,pct(c,S.n)]),pct(S.tren5,S.n),S.duoi35]})]}
document.addEventListener('DOMContentLoaded',()=>{renderBooks();fromBooks()});
</script>
<script src="eduhub_backup.js"></script>
</body>
</html>
