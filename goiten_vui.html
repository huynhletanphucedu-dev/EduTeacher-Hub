<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gọi tên vui – EduTeacher Hub</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--sub:#94a3b8;--teal:#06b6d4;--orange:#f59e0b;--green:#10b981;--red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
/* thanh trên */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap}
.back{color:var(--sub);text-decoration:none;font-weight:600;font-size:.9rem;padding:6px 12px;border:1px solid var(--border);border-radius:9px}
.top h1{font-size:1.15rem;font-weight:800;margin-right:auto}
.tabs{display:flex;gap:6px}
.tab{background:transparent;border:1.5px solid var(--border);color:var(--sub);padding:8px 14px;border-radius:10px;font-weight:800;font-size:.95rem}
.tab.on{border-color:var(--teal);color:#a5f3fc;background:rgba(6,182,212,.12)}
.ib{background:#0b1220;border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:10px;font-weight:700;font-size:.85rem}
/* sân khấu */
.stage{position:relative;flex:1;overflow:hidden;min-height:0}
.scene{position:absolute;inset:0;overflow:hidden}
.sky-ufo{background:radial-gradient(ellipse at 50% 0%,#1e1b4b 0%,#0b1026 55%,#050816 100%)}
.sky-cop{background:linear-gradient(#7dd3fc 0%,#bae6fd 45%,#86efac 46%,#4ade80 100%)}
.stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.7;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.15}}
.ground-ufo{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(#14532d,#052e16);border-top:3px solid #166534}
.road{position:absolute;left:0;right:0;height:16px;background:#64748b;opacity:.35}
/* lưới vị trí */
.grid{position:absolute;left:2%;right:2%;display:grid;gap:clamp(4px,1vw,12px);justify-items:center;align-items:end}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .25s,opacity .4s,filter .3s;width:100%}
.slot .nm{font-weight:800;font-size:var(--fs,13px);line-height:1.15;text-align:center;padding:2px 6px;border-radius:7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.used{opacity:.28;filter:grayscale(1)}
.slot.hot .nm{background:#fde047;color:#111}
.slot svg{width:var(--sz,46px);height:auto;display:block}
/* UFO */
.ufo-slot .nm{color:#ecfeff;background:rgba(15,23,42,.55)}
.ufo-slot.abduct{transition:transform 1.6s cubic-bezier(.5,0,.6,1),opacity 1.6s;transform:translateY(calc(-1 * var(--lift,300px))) scale(.3) rotate(25deg);opacity:0}
.ufo{position:absolute;left:0;top:0;width:var(--uw,150px);z-index:5;transition:transform .9s cubic-bezier(.45,.05,.3,1);will-change:transform;pointer-events:none}
.ufo svg{width:100%;height:auto;display:block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.beam{position:absolute;left:50%;top:78%;width:70%;transform:translateX(-50%);height:0;opacity:0;transition:height .45s,opacity .45s;
  background:linear-gradient(rgba(250,250,150,.75),rgba(250,250,150,.08));clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);transform-origin:top}
.ufo.on .beam{opacity:1}
/* Công an */
.cop-slot .nm{color:#0f172a;background:rgba(255,255,255,.85)}
.cop-slot.knock svg{animation:shake .12s 5}
@keyframes shake{25%{transform:translateX(-3px) rotate(-2deg)}75%{transform:translateX(3px) rotate(2deg)}}
.cop-slot .door{transition:transform .6s;transform-origin:left center;transform-box:fill-box}
.cop-slot.open .door{transform:scaleX(.08)}
.cop-slot .kid{opacity:0;transition:opacity .4s .3s}
.cop-slot.open .kid{opacity:1}
.cop{position:absolute;left:0;top:0;width:var(--cw,64px);z-index:5;transition:transform .8s cubic-bezier(.45,.05,.3,1);pointer-events:none}
.cop svg{width:100%;height:auto;display:block}
.cop.walk svg{animation:walk .3s infinite alternate}
@keyframes walk{to{transform:translateY(-4px) rotate(3deg)}}
.cop .bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;color:#111;font-weight:900;font-size:.8rem;padding:3px 8px;border-radius:10px;white-space:nowrap;opacity:0;transition:opacity .2s}
.cop.talk .bubble{opacity:1}
/* nút gọi + thanh dưới */
.bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 12px;background:var(--card);border-top:1px solid var(--border);flex-wrap:wrap}
.go{background:linear-gradient(135deg,#06b6d4,#3b82f6);color:#fff;border:none;border-radius:14px;padding:13px 30px;font-size:1.2rem;font-weight:900;box-shadow:0 6px 20px rgba(59,130,246,.4)}
.go:disabled{opacity:.5;cursor:wait}
.ck{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--sub)}
.cnt{font-size:.85rem;color:var(--sub)}
/* kết quả */
.res{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,.55);backdrop-filter:blur(3px);padding:16px}
.res-card{background:#fff;color:#0f172a;border-radius:24px;padding:26px 30px;text-align:center;max-width:min(640px,94vw);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.res-ic{font-size:3rem;line-height:1}
.res-lb{font-size:1rem;font-weight:700;color:#64748b;margin-top:6px}
.res-nm{font-size:clamp(2rem,7vw,4.2rem);font-weight:900;color:#1d4ed8;margin:6px 0 4px;line-height:1.1;word-break:break-word}
.res-msg{font-size:1.05rem;color:#334155}
.res-btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.res-btns button{border:none;border-radius:12px;padding:10px 18px;font-weight:800;font-size:.95rem}
.b1{background:#2563eb;color:#fff}.b2{background:#e2e8f0;color:#0f172a}
.conf{position:absolute;width:10px;height:14px;top:-20px;z-index:21;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* hộp danh sách */
.dlg{position:fixed;inset:0;background:rgba(2,6,23,.6);z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}
.dlg-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;width:min(520px,100%);display:flex;flex-direction:column;gap:10px;max-height:92vh;overflow:auto}
.dlg-box h3{font-size:1.05rem}
.dlg-box textarea{width:100%;min-height:220px;background:#0b1220;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;font-size:.92rem;resize:vertical}
.dlg-box .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hint{font-size:.8rem;color:var(--sub);line-height:1.5}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#e2e8f0;font-size:1.05rem;z-index:3}
.tab .s{display:none}
@media(max-width:600px){.top{gap:6px;padding:8px}.top h1,.back span,.tab span:not(.s){display:none}.tab .s{display:inline}.tab{padding:7px 9px;font-size:.85rem}.ib{padding:7px 9px}.tabs{margin-right:auto}.go{padding:11px 22px;font-size:1.05rem}.bar{gap:8px;padding:8px}}
</style>
</head>
<body>
<div class="top">
  <a href="dashboard.html" class="back">← <span>Dashboard</span></a>
  <h1>🎲 Gọi tên vui</h1>
  <div class="tabs">
    <button class="tab on" data-m="ufo">🛸 <span>UFO bắt cóc</span><span class="s">UFO</span></button>
    <button class="tab" data-m="cop">👮 <span>Công an kiểm tra nhà</span><span class="s">Công an</span></button>
  </div>
  <button class="ib" id="btnList">📋 Danh sách</button>
  <button class="ib" id="btnSnd" title="Bật/tắt âm thanh">🔊</button>
  <button class="ib" id="btnFs" title="Toàn màn hình">⛶</button>
</div>

<div class="stage" id="stage"></div>

<div class="bar">
  <button class="go" id="go">🎲 Gọi tên!</button>
  <label class="ck"><input type="checkbox" id="noRepeat" checked> Không gọi lại</label>
  <span class="cnt" id="cnt"></span>
  <button class="ib" id="btnReset">↺ Gọi lại từ đầu</button>
</div>

<div class="dlg" id="dlg" hidden>
  <div class="dlg-box">
    <h3>📋 Danh sách học sinh</h3>
    <div class="hint">Mỗi dòng một tên (dán từ Excel được). Có thể lấy nhanh từ danh sách lớp chủ nhiệm.</div>
    <textarea id="ta" placeholder="Nguyễn Văn An&#10;Trần Thị Bình&#10;…"></textarea>
    <div class="row">
      <button class="ib" id="fromCN">⬇ Lấy từ lớp chủ nhiệm</button>
      <button class="ib" id="dlgCancel">Hủy</button>
      <button class="go" id="dlgOk" style="padding:9px 18px;font-size:.95rem">Lưu</button>
    </div>
  </div>
</div>

<script>
/* ═════ DỮ LIỆU ═════ */
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function cnNames(){const s=store.get('cn_students',[])||[];return s.map(x=>(x.hoTen||'').trim()).filter(Boolean);}
let names=store.get('gtv_list',null);
if(!names||!names.length) names=cnNames();
let used=new Set(store.get('gtv_used',[]));
let mode=store.get('gtv_mode','ufo');
let sound=store.get('gtv_sound',true);
let busy=false;
const short=n=>{const p=n.trim().split(/\s+/);return p.length>2?p.slice(-2).join(' '):n.trim();};

/* ═════ ÂM THANH (WebAudio, không cần tệp) ═════ */
let AC=null;
function tone(f,d=.15,type='sine',v=.15,slide=0){ if(!sound) return; try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){} }
const sfx={
  hop:()=>tone(mode==='ufo'?520:300,.12,mode==='ufo'?'sine':'triangle',.12,mode==='ufo'?780:260),
  knock:()=>{tone(180,.07,'square',.2);setTimeout(()=>tone(170,.07,'square',.2),130);},
  beam:()=>tone(300,1.4,'sawtooth',.06,1200),
  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.16),i*120)),
  siren:()=>{for(let i=0;i<4;i++)setTimeout(()=>tone(i%2?660:880,.22,'square',.06),i*220);}
};

/* ═════ HÌNH VẼ SVG (tự vẽ) ═════ */
const KID=c=>`<svg viewBox="0 0 40 52"><circle cx="20" cy="12" r="9" fill="#fcd9b6"/><path d="M11 10 Q20 0 29 10 Q26 5 20 5 Q14 5 11 10Z" fill="#3f2a1d"/><circle cx="17" cy="12" r="1.3" fill="#111"/><circle cx="23" cy="12" r="1.3" fill="#111"/><path d="M17 16 Q20 18 23 16" stroke="#111" stroke-width="1.2" fill="none"/><path d="M8 50 Q8 24 20 23 Q32 24 32 50Z" fill="${c}"/><rect x="17" y="23" width="6" height="7" fill="#fff"/><path d="M18 23 L20 32 L22 23Z" fill="#dc2626"/></svg>`;
const KCOL=['#2563eb','#0ea5e9','#7c3aed','#db2777','#059669','#ea580c','#4f46e5','#0891b2'];
const UFO=`<svg viewBox="0 0 160 80"><ellipse cx="80" cy="30" rx="30" ry="24" fill="#a5f3fc" opacity=".85"/><circle cx="72" cy="24" r="5" fill="#86efac"/><circle cx="72" cy="24" r="2" fill="#111"/><circle cx="88" cy="24" r="5" fill="#86efac"/><circle cx="88" cy="24" r="2" fill="#111"/><ellipse cx="80" cy="48" rx="78" ry="17" fill="#94a3b8"/><ellipse cx="80" cy="44" rx="78" ry="14" fill="#cbd5e1"/><g fill="#fde047"><circle cx="22" cy="48" r="4"/><circle cx="51" cy="54" r="4"/><circle cx="80" cy="56" r="4"/><circle cx="109" cy="54" r="4"/><circle cx="138" cy="48" r="4"/></g></svg>`;
const HCOL=['#f87171','#fb923c','#facc15','#4ade80','#60a5fa','#a78bfa','#f472b6','#2dd4bf'];
const HOUSE=(c,k)=>`<svg viewBox="0 0 60 56"><path d="M4 26 L30 4 L56 26Z" fill="${c}" stroke="#7c2d12" stroke-width="1.5"/><rect x="9" y="26" width="42" height="28" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/><rect x="13" y="31" width="10" height="9" fill="#bae6fd" stroke="#92400e"/><g class="kid">${'<circle cx="38" cy="40" r="4.5" fill="#fcd9b6"/><rect x="33.5" y="44" width="9" height="10" fill="'+k+'"/>'}</g><rect class="door" x="32" y="34" width="12" height="20" fill="#b45309" stroke="#78350f"/><circle cx="41" cy="45" r="1" fill="#fde047"/></svg>`;
const COP=`<svg viewBox="0 0 50 80"><path d="M12 14 Q25 2 38 14 L38 18 L12 18Z" fill="#14532d"/><rect x="10" y="17" width="30" height="4" rx="2" fill="#052e16"/><circle cx="25" cy="16" r="3" fill="#facc15"/><circle cx="25" cy="27" r="9" fill="#fcd9b6"/><circle cx="22" cy="26" r="1.2" fill="#111"/><circle cx="28" cy="26" r="1.2" fill="#111"/><path d="M22 31 Q25 33 28 31" stroke="#111" stroke-width="1.2" fill="none"/><path d="M10 64 Q10 38 25 37 Q40 38 40 64Z" fill="#3f6212"/><rect x="18" y="37" width="14" height="4" fill="#dc2626"/><rect x="21" y="45" width="8" height="2" fill="#facc15"/><rect x="14" y="64" width="9" height="14" fill="#1e293b"/><rect x="27" y="64" width="9" height="14" fill="#1e293b"/><rect x="37" y="44" width="10" height="5" rx="2" fill="#fde047" transform="rotate(-20 42 46)"/></svg>`;

/* ═════ DỰNG SÂN KHẤU ═════ */
let slots=[],mover=null;
function layout(n,W,H,top,bot){
  // chọn số cột để ô gần vuông
  let best={c:1,r:n,s:0};
  for(let c=1;c<=n;c++){const r=Math.ceil(n/c);const s=Math.min(W/c,(H-top-bot)/r);if(s>best.s)best={c,r,s};}
  return best;
}
function build(){
  const st=$('stage');st.innerHTML='';slots=[];
  const W=st.clientWidth,H=st.clientHeight;
  const sc=document.createElement('div');sc.className='scene '+(mode==='ufo'?'sky-ufo':'sky-cop');st.appendChild(sc);
  if(!names.length){const e=document.createElement('div');e.className='empty';e.innerHTML='Chưa có danh sách học sinh.<br>Bấm <b>📋 Danh sách</b> để dán tên hoặc lấy từ lớp chủ nhiệm.';st.appendChild(e);updCnt();return;}
  if(mode==='ufo'){const s=document.createElement('div');s.className='stars';for(let i=0;i<60;i++){const d=document.createElement('i');d.style.left=Math.random()*100+'%';d.style.top=Math.random()*60+'%';d.style.animationDelay=Math.random()*3+'s';s.appendChild(d);}sc.appendChild(s);
    const g=document.createElement('div');g.className='ground-ufo';g.id='ground';sc.appendChild(g);}
  const topRes=mode==='ufo'?Math.max(110,H*.28):Math.max(70,H*.12);
  const L=layout(names.length,W*.96,H,topRes,12);
  const cell=L.s, fs=Math.max(10,Math.min(18,cell*.16));
  const grid=document.createElement('div');grid.className='grid';
  grid.style.gridTemplateColumns=`repeat(${L.c},minmax(0,1fr))`;grid.style.top=topRes+'px';grid.style.bottom='12px';grid.style.alignContent='end';
  grid.style.setProperty('--fs',fs+'px');grid.style.setProperty('--sz',Math.min(cell*.62,mode==='ufo'?70:90)+'px');
  names.forEach((n,i)=>{const d=document.createElement('div');d.className='slot '+(mode==='ufo'?'ufo-slot':'cop-slot')+(used.has(n)?' used':'');
    d.innerHTML=(mode==='ufo'?KID(KCOL[i%KCOL.length]):HOUSE(HCOL[i%HCOL.length],KCOL[(i+3)%KCOL.length]))+`<div class="nm" title="${esc(n)}">${esc(short(n))}</div>`;
    d.dataset.name=n;grid.appendChild(d);slots.push(d);});
  sc.appendChild(grid);
  const gr=document.getElementById('ground'); if(gr) gr.style.height=(H-topRes+8)+'px';
  if(mode==='ufo'){mover=document.createElement('div');mover.className='ufo';mover.style.setProperty('--uw',Math.max(90,Math.min(180,W*.16))+'px');mover.innerHTML='<div class="beam"></div>'+UFO;}
  else{mover=document.createElement('div');mover.className='cop';mover.style.setProperty('--cw',Math.max(44,Math.min(80,cell*.55))+'px');mover.innerHTML='<div class="bubble">Cốc cốc!</div>'+COP;}
  sc.appendChild(mover);
  park();updCnt();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function park(){ if(!mover) return; mover.style.transition='none';
  if(mode==='ufo') moveTo(null,$('stage').clientWidth*.5,20); else moveTo(null,10,$('stage').clientHeight-mover.offsetHeight-6);
  mover.offsetWidth; mover.style.transition=''; }
function moveTo(slot,x,y){ // đưa UFO/công an tới trên (hoặc cạnh) một ô
  const st=$('stage').getBoundingClientRect();
  if(slot){const r=slot.getBoundingClientRect();
    if(mode==='ufo'){x=r.left-st.left+r.width/2;y=Math.max(4,r.top-st.top-mover.offsetHeight*1.25);}
    else{x=r.left-st.left+r.width*.5+r.width*.35;y=r.bottom-st.top-mover.offsetHeight;}
  }
  mover.style.transform=`translate(${x-mover.offsetWidth/2}px,${y}px)`;
}
function updCnt(){const left=names.filter(n=>!used.has(n)).length;$('cnt').textContent=names.length?`Còn ${$('noRepeat').checked?left:names.length}/${names.length} em`:'';}

/* ═════ GỌI TÊN ═════ */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function call(){
  if(busy||!names.length) return;
  let pool=slots.filter(s=>!$('noRepeat').checked||!used.has(s.dataset.name));
  if(!pool.length){ if(!confirmReset()) return; pool=slots.slice(); }
  busy=true;$('go').disabled=true;
  const pick=pool[Math.floor(Math.random()*pool.length)];
  // các bước "lượn" hồi hộp, chậm dần
  const hops=Math.min(9,Math.max(4,Math.round(pool.length/3)));
  let prev=null;
  if(mode==='cop'){mover.classList.add('walk');sfx.siren();}
  for(let i=0;i<hops;i++){
    let s; do{ s=pool[Math.floor(Math.random()*pool.length)]; }while(pool.length>2&&(s===prev||s===pick));
    const dur=mode==='ufo'?520+i*90:480+i*70; mover.style.transitionDuration=dur+'ms';
    moveTo(s); await wait(dur);
    slots.forEach(x=>x.classList.remove('hot')); s.classList.add('hot'); sfx.hop();
    if(mode==='ufo'){mover.classList.add('on');setBeam(s);await wait(260);mover.classList.remove('on');}
    else{mover.classList.add('talk');s.classList.add('knock');sfx.knock();await wait(520);s.classList.remove('knock');mover.classList.remove('talk');}
    prev=s;
  }
  // tới người được chọn
  const dur=1100; mover.style.transitionDuration=dur+'ms'; moveTo(pick); await wait(dur);
  slots.forEach(x=>x.classList.remove('hot')); pick.classList.add('hot');
  if(mode==='ufo'){
    mover.classList.add('on');setBeam(pick);sfx.beam();await wait(500);
    const r=pick.getBoundingClientRect(),u=mover.getBoundingClientRect();pick.style.setProperty('--lift',(r.top-u.bottom+40)+'px');
    pick.classList.add('abduct');await wait(1700);mover.classList.remove('on');
  }else{
    mover.classList.remove('walk');mover.classList.add('talk');pick.classList.add('knock');sfx.knock();await wait(700);
    pick.classList.remove('knock');pick.classList.add('open');mover.querySelector('.bubble').textContent='Có ai ở nhà không?';await wait(1100);mover.classList.remove('talk');
    mover.querySelector('.bubble').textContent='Cốc cốc!';
  }
  used.add(pick.dataset.name);store.set('gtv_used',[...used]);
  sfx.win();showResult(pick);
}
function setBeam(s){const b=mover.querySelector('.beam');const r=s.getBoundingClientRect(),u=mover.getBoundingClientRect();b.style.height=Math.max(20,r.top-u.top-u.height*.6+r.height*.4)+'px';}
function confirmReset(){ // hết người: tự bắt đầu vòng mới
  used.clear();store.set('gtv_used',[]);slots.forEach(s=>s.classList.remove('used'));updCnt();return true;}
const MSG_UFO=['Người ngoài hành tinh mời em lên bảng! 👽','Em đã được chọn đi du hành… lên bảng! 🚀','UFO cần câu trả lời của em!'];
const MSG_COP=['Chú công an mời em trả lời câu hỏi nhé! 👮','Kiểm tra bài cũ: mời em lên bảng!','Nhà em được chọn rồi đó! 🏠'];
function showResult(pick){
  const n=pick.dataset.name;const st=$('stage');
  const d=document.createElement('div');d.className='res';
  d.innerHTML=`<div class="res-card"><div class="res-ic">${mode==='ufo'?'🛸':'👮'}</div><div class="res-lb">Xin mời</div><div class="res-nm">${esc(n)}</div><div class="res-msg">${(mode==='ufo'?MSG_UFO:MSG_COP)[Math.floor(Math.random()*3)]}</div>
  <div class="res-btns"><button class="b1" id="again">🎲 Gọi tiếp</button><button class="b2" id="close">Đóng</button></div></div>`;
  st.appendChild(d);confetti(st);
  const done=()=>{d.remove();finish(pick);};
  d.querySelector('#close').onclick=done;
  d.querySelector('#again').onclick=()=>{done();setTimeout(call,80);};
  d.onclick=e=>{if(e.target===d)done();};
}
function finish(pick){
  pick.classList.remove('abduct','open','hot');pick.style.removeProperty('--lift');
  if($('noRepeat').checked) pick.classList.add('used');
  busy=false;$('go').disabled=false;mover.style.transitionDuration='';park();updCnt();
}
function confetti(st){const C=['#f43f5e','#f59e0b','#10b981','#3b82f6','#a855f7','#fde047'];
  for(let i=0;i<70;i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'%';c.style.background=C[i%C.length];c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=Math.random()*.4+'s';st.appendChild(c);setTimeout(()=>c.remove(),3600);}}

/* ═════ ĐIỀU KHIỂN ═════ */
document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('on',b.dataset.m===mode);
  b.onclick=()=>{if(busy)return;mode=b.dataset.m;store.set('gtv_mode',mode);document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));build();};});
$('go').onclick=call;
$('btnReset').onclick=()=>{if(busy)return;used.clear();store.set('gtv_used',[]);build();};
$('noRepeat').onchange=()=>{build();};
$('btnSnd').textContent=sound?'🔊':'🔇';
$('btnSnd').onclick=()=>{sound=!sound;store.set('gtv_sound',sound);$('btnSnd').textContent=sound?'🔊':'🔇';};
$('btnFs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();};
$('btnList').onclick=()=>{$('ta').value=names.join('\n');$('dlg').hidden=false;$('ta').focus();};
$('dlgCancel').onclick=()=>{$('dlg').hidden=true;};
$('fromCN').onclick=()=>{const l=cnNames();if(!l.length){alert('Chưa có danh sách lớp chủ nhiệm. Thầy/cô vào Chủ Nhiệm → Danh sách học sinh để nhập.');return;}$('ta').value=l.join('\n');};
$('dlgOk').onclick=()=>{names=[...new Set($('ta').value.split(/\r?\n/).map(s=>s.split('\t').find(x=>x.trim()&&isNaN(x))||'').map(s=>s.trim()).filter(Boolean))];
  store.set('gtv_list',names);used=new Set([...used].filter(n=>names.includes(n)));store.set('gtv_used',[...used]);$('dlg').hidden=true;build();};
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.code==='Space'||e.key==='Enter'){e.preventDefault();const r=document.querySelector('.res #again');if(r)r.click();else call();}});
let rt;new ResizeObserver(()=>{if(busy)return;clearTimeout(rt);rt=setTimeout(build,120);}).observe($('stage'));
build();
</script>
<div style="padding:6px 0;text-align:center;font-size:12px;color:#64748b;background:var(--card)">📚 EduTeacher Hub được phát triển bởi <strong style="color:#94a3b8">ThS. Huỳnh Lê Tấn Phúc</strong></div>
</body>
