<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gọi tên vui – EduTeacher Hub</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--sub:#94a3b8;--teal:#06b6d4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
button,select{font-family:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap}
.back{color:var(--sub);text-decoration:none;font-weight:600;font-size:.88rem;padding:6px 11px;border:1px solid var(--border);border-radius:9px}
body.embed .back{display:none}
.top h1{font-size:1.08rem;font-weight:800}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-right:auto}
.tab{background:transparent;border:1.5px solid var(--border);color:var(--sub);padding:7px 11px;border-radius:10px;font-weight:800;font-size:.9rem;white-space:nowrap}
.tab.on{border-color:var(--teal);color:#a5f3fc;background:rgba(6,182,212,.12)}
.ib{background:#0b1220;border:1px solid var(--border);color:var(--text);padding:7px 11px;border-radius:10px;font-weight:700;font-size:.85rem}
select.ib{max-width:190px}
.stage{position:relative;flex:1;overflow:hidden;min-height:0}
.scene{position:absolute;inset:0;overflow:hidden}
.amb{position:absolute;pointer-events:none}
/* ===== lưới học sinh ===== */
.grid{position:absolute;left:2%;right:2%;display:grid;gap:clamp(4px,1vw,12px);justify-items:center;align-content:end;z-index:2}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;transition:opacity .4s,filter .3s}
.slot .fig{width:var(--sz,46px);position:relative}
.slot .fig svg{width:100%;height:auto;display:block;overflow:visible}
.slot .nm{font-weight:800;font-size:var(--fs,13px);line-height:1.15;text-align:center;padding:2px 6px;border-radius:7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.used{opacity:.28;filter:grayscale(1)}
.slot.hot .nm{background:#fde047!important;color:#111!important;box-shadow:0 0 0 3px rgba(253,224,71,.4)}
.idle{animation:var(--ia) var(--id,2s) ease-in-out infinite alternate;animation-delay:var(--dl,0s);transform-origin:50% 100%}
@keyframes bob{to{transform:translateY(-5px)}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes swim{from{transform:translateX(-9px)}to{transform:translateX(9px)}}
@keyframes peck{0%,70%{transform:rotate(0)}85%{transform:rotate(14deg)}100%{transform:rotate(0)}}
@keyframes breathe{to{transform:scale(1.04,.97)}}
.shake{animation:shk .12s 6!important}
@keyframes shk{25%{transform:translateX(-4px) rotate(-3deg)}75%{transform:translateX(4px) rotate(3deg)}}
/* ===== nhân vật di chuyển ===== */
.mover{position:absolute;left:0;top:0;z-index:6;pointer-events:none;transition:transform .9s cubic-bezier(.45,.05,.3,1);will-change:transform}
.mover>svg{width:100%;height:auto;display:block;overflow:visible}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;color:#111;font-weight:900;font-size:.8rem;padding:3px 9px;border-radius:10px;white-space:nowrap;opacity:0;transition:opacity .2s;z-index:2}
.mover.talk .bubble{opacity:1}
/* UFO */
.sky-ufo{background:radial-gradient(ellipse at 50% 0%,#1e1b4b 0%,#0b1026 55%,#050816 100%)}
.star{width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.15}}
.shoot{width:120px;height:2px;background:linear-gradient(90deg,#fff,transparent);top:10%;left:-150px;animation:shoot 9s linear infinite;opacity:.8}
@keyframes shoot{0%,80%{transform:translate(0,0) rotate(18deg);opacity:0}82%{opacity:1}100%{transform:translate(120vw,38vh) rotate(18deg);opacity:0}}
.moon{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fef9c3,#facc15);right:6%;top:6%;box-shadow:0 0 40px rgba(250,204,21,.5)}
.ground-ufo{left:0;right:0;bottom:0;background:linear-gradient(#14532d,#052e16);border-top:3px solid #166534}
.ufo svg{animation:hover 1.4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-7px) rotate(-2deg)}}
.beam{position:absolute;left:50%;top:70%;width:80%;height:var(--bh,160px);transform-origin:50% 0;transform:translateX(-50%) rotate(0);
  background:linear-gradient(rgba(253,253,170,.6),rgba(253,253,170,.05));clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);animation:sweep 2.2s ease-in-out infinite alternate;transition:height .4s}
@keyframes sweep{from{transform:translateX(-50%) rotate(-22deg)}to{transform:translateX(-50%) rotate(22deg)}}
.ufo.lock .beam{animation:none;transform:translateX(-50%) rotate(0);background:linear-gradient(rgba(253,253,170,.85),rgba(253,253,170,.2))}
.abduct{transition:transform 1.6s cubic-bezier(.5,0,.6,1),opacity 1.6s!important;transform:translateY(calc(-1 * var(--lift,300px))) scale(.3) rotate(25deg);opacity:0}
/* Máy gắp thú */
.sky-claw{background:radial-gradient(ellipse at 50% 30%,#7e22ce 0%,#4c1d95 55%,#2e1065 100%)}
.glass{inset:6px;border:6px solid #f472b6;border-radius:18px;box-shadow:inset 0 0 40px rgba(255,255,255,.12),0 0 18px rgba(244,114,182,.6);background:linear-gradient(115deg,rgba(255,255,255,.08) 0 18%,transparent 18% 30%,rgba(255,255,255,.05) 30% 34%,transparent 34%)}
.rail{left:14px;right:14px;top:16px;height:12px;border-radius:6px;background:linear-gradient(#e2e8f0,#94a3b8);box-shadow:0 3px 0 #475569}
.bulb{width:10px;height:10px;border-radius:50%;background:#fde047;box-shadow:0 0 10px #fde047;animation:tw 1.2s infinite}
.pile{left:0;right:0;bottom:0;background:linear-gradient(#a21caf,#701a75);border-top:4px solid #e879f9}
.claw{top:0}
.claw .cart{position:relative;z-index:2}
.claw .cab{position:absolute;left:50%;top:62%;width:3px;margin-left:-1.5px;height:var(--ll,10px);background:repeating-linear-gradient(#e2e8f0 0 4px,#94a3b8 4px 8px);transition:height .55s ease-in-out}
.claw .hand{position:absolute;left:50%;width:78%;top:calc(62% + var(--ll,10px));transform:translateX(-50%);transition:top .55s ease-in-out}
.claw .hand svg{width:100%;height:auto;display:block;overflow:visible}
.claw .pl,.claw .pr{transition:transform .35s;transform-box:fill-box}
.claw .pl{transform-origin:100% 0;transform:rotate(18deg)}.claw .pr{transform-origin:0 0;transform:rotate(-18deg)}
.claw.grab .pl,.claw.grab .pr{transform:rotate(0)}
.grabbed .fig{transition:transform 1.3s ease-in-out!important;transform:translateY(calc(-1 * var(--lift,300px))) rotate(-8deg)}
/* Phóng tên lửa */
.sky-rkt{background:linear-gradient(#020617 0%,#1e1b4b 45%,#7c2d12 85%,#ea580c 100%)}
.pad{left:0;right:0;bottom:0;background:repeating-linear-gradient(90deg,#334155 0 40px,#475569 40px 80px);border-top:4px solid #facc15}
.rkt-slot .flame{opacity:0;transform-origin:50% 0;transform-box:fill-box}
.rkt-slot.ignite .flame{opacity:1;animation:flick .08s infinite alternate}
@keyframes flick{to{transform:scaleY(1.35)}}
.rkt-slot.launch .fig{transition:transform 1.7s cubic-bezier(.55,0,.85,.35)!important;transform:translateY(-130vh)}
.puff{position:absolute;width:22px;height:22px;border-radius:50%;background:#e2e8f0;z-index:7;pointer-events:none;animation:puff 1.4s ease-out forwards}
@keyframes puff{0%{opacity:.9;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(2.6)}}
.robot .bubble{font-size:1.1rem;padding:4px 12px}
/* Công an */
.sky-cop{background:linear-gradient(#7dd3fc 0%,#bae6fd 40%,#86efac 41%,#4ade80 100%)}
.sun{width:64px;height:64px;border-radius:50%;background:#fde047;right:5%;top:4%;box-shadow:0 0 0 10px rgba(253,224,71,.3);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(253,224,71,.15)}}
.cloud{width:120px;height:36px;background:#fff;border-radius:40px;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50px;height:50px;left:18px;top:-24px}.cloud::after{width:38px;height:38px;left:60px;top:-16px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
.car{width:70px;bottom:6px;animation:car 11s linear infinite;z-index:1}
@keyframes car{from{transform:translateX(-90px)}to{transform:translateX(110vw)}}
.smoke{position:absolute;left:62%;top:-4px;width:7px;height:7px;border-radius:50%;background:#cbd5e1;opacity:0;animation:smoke 3s infinite;animation-delay:var(--dl,0s)}
@keyframes smoke{0%{opacity:.8;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-26px) scale(2)}}
.cop-slot .nm{color:#0f172a;background:rgba(255,255,255,.88)}
.cop-slot .door{transition:transform .6s;transform-origin:left center;transform-box:fill-box}
.cop-slot.open .door{transform:scaleX(.08)}
.cop-slot .kid{opacity:0;transition:opacity .4s .3s}.cop-slot.open .kid{opacity:1}
.cop-slot .win{animation:winl 4s infinite;animation-delay:var(--dl,0s)}
@keyframes winl{0%,60%{fill:#bae6fd}70%,100%{fill:#fde68a}}
.cop.walk>svg{animation:walk .3s infinite alternate}
@keyframes walk{to{transform:translateY(-4px) rotate(3deg)}}
.torch{position:absolute;left:80%;top:52%;width:160%;height:60%;transform-origin:0 50%;background:linear-gradient(90deg,rgba(255,250,200,.7),rgba(255,250,200,0));clip-path:polygon(0 40%,100% 0,100% 100%,0 60%);animation:tsw 1.6s ease-in-out infinite alternate}
@keyframes tsw{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
/* Câu cá */
.sky-fish{background:linear-gradient(#bae6fd 0%,#e0f2fe calc(var(--wl) - 1px),#38bdf8 var(--wl),#0369a1 70%,#082f49 100%)}
.wave{left:-10%;width:120%;height:14px;top:calc(var(--wl) - 7px);background:radial-gradient(circle at 10px -2px,transparent 11px,#38bdf8 12px) 0 0/24px 14px repeat-x;animation:wave 3s linear infinite}
@keyframes wave{to{transform:translateX(24px)}}
.bub{width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);bottom:-10px;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-75vh) translateX(14px);opacity:0}}
.weed{bottom:0;width:18px;transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite alternate}
.fish-slot .nm{color:#fff;background:rgba(8,47,73,.6)}
.line{position:absolute;left:var(--lx,80%);top:8%;width:2px;height:var(--ll,0px);background:#e2e8f0;transition:height .5s;transform-origin:top}
.line::after{content:'';position:absolute;left:-5px;bottom:-8px;width:10px;height:10px;border:2.5px solid #e2e8f0;border-top:none;border-left:none;border-radius:0 0 10px 0;transform:rotate(45deg)}
.boat>svg{animation:rock 2s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes rock{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.hooked{transition:transform 1.4s ease-in,opacity 1.4s!important;transform:translateY(calc(-1 * var(--lift,300px))) rotate(-60deg) scale(.6);opacity:0}
/* Bóng bay */
.sky-ball{background:linear-gradient(#38bdf8 0%,#7dd3fc 60%,#bbf7d0 88%,#4ade80 89%,#22c55e 100%)}
.ball-slot .nm{color:#0f172a;background:rgba(255,255,255,.88)}
.pop{animation:popb .35s forwards!important}
@keyframes popb{40%{transform:scale(1.35)}100%{transform:scale(1.6);opacity:0}}
.shard{position:absolute;width:8px;height:8px;border-radius:2px;z-index:7;pointer-events:none;animation:shard .7s ease-out forwards}
@keyframes shard{to{transform:translate(var(--dx),var(--dy)) rotate(300deg);opacity:0}}
.dart>svg{animation:aim .5s ease-in-out infinite alternate}
@keyframes aim{to{transform:translate(2px,-3px) rotate(-4deg)}}
.dart.fly{transition-timing-function:cubic-bezier(.6,0,.9,.5)!important}
/* Gà đẻ trứng */
.sky-hen{background:linear-gradient(#fde68a 0%,#fef3c7 30%,#d9f99d 31%,#a3e635 60%,#65a30d 100%)}
.fence{left:0;right:0;height:26px;background:repeating-linear-gradient(90deg,#92400e 0 8px,transparent 8px 40px),linear-gradient(transparent 6px,#b45309 6px 10px,transparent 10px 16px,#b45309 16px 20px,transparent 20px)}
.hen-slot .nm{color:#422006;background:rgba(255,255,255,.85)}
.egg{position:absolute;left:50%;bottom:12%;width:44%;transform:translateX(-50%) scale(0);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.hen-slot.lay .egg{transform:translateX(-50%) translateY(30%) scale(1.25)}
.hen-slot.lay .henb{animation:jump .5s 2}
@keyframes jump{50%{transform:translateY(-14px)}}
.chick>svg{animation:walk .25s infinite alternate}
.feather{position:absolute;width:10px;height:6px;border-radius:50%;background:#fff;z-index:7;animation:feather 1.2s ease-out forwards}
@keyframes feather{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
/* thanh dưới + kết quả */
.bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 12px;background:var(--card);border-top:1px solid var(--border);flex-wrap:wrap}
.go{background:linear-gradient(135deg,#06b6d4,#3b82f6);color:#fff;border:none;border-radius:14px;padding:12px 30px;font-size:1.2rem;font-weight:900;box-shadow:0 6px 20px rgba(59,130,246,.4)}
.go:disabled{opacity:.5;cursor:wait}
.ck{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--sub)}
.cnt{font-size:.85rem;color:var(--sub)}
.res{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,.5);backdrop-filter:blur(3px);padding:16px}
.res-card{background:#fff;color:#0f172a;border-radius:24px;padding:24px 30px;text-align:center;max-width:min(640px,94vw);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:rpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes rpop{from{transform:scale(.4);opacity:0}}
.res-ic{font-size:3rem;line-height:1}
.res-lb{font-size:1rem;font-weight:700;color:#64748b;margin-top:6px}
.res-nm{font-size:clamp(2rem,7vw,4.2rem);font-weight:900;color:#1d4ed8;margin:6px 0 4px;line-height:1.1;word-break:break-word}
.res-msg{font-size:1.05rem;color:#334155}
.res-btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.res-btns button{border:none;border-radius:12px;padding:10px 18px;font-weight:800;font-size:.95rem}
.b1{background:#2563eb;color:#fff}.b2{background:#e2e8f0;color:#0f172a}
.conf{position:absolute;width:10px;height:14px;top:-20px;z-index:21;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.dlg{position:fixed;inset:0;background:rgba(2,6,23,.6);z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}
.dlg-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;width:min(520px,100%);display:flex;flex-direction:column;gap:10px;max-height:92vh;overflow:auto}
.dlg-box textarea{width:100%;min-height:220px;background:#0b1220;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;font-size:.92rem;resize:vertical}
.dlg-box .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hint{font-size:.8rem;color:var(--sub);line-height:1.5}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#0f172a;font-size:1.05rem;z-index:3;font-weight:600}
.empty span{background:rgba(255,255,255,.9);padding:16px 20px;border-radius:14px}
.tab .s{display:none}
@media(max-width:700px){.top h1,.back span,.tab .l{display:none}.tab .s{display:inline}.tab{padding:6px 8px;font-size:.82rem}.ib{padding:6px 8px}select.ib{max-width:130px}.go{padding:10px 22px;font-size:1.05rem}.bar{gap:8px;padding:8px}}
@media (prefers-reduced-motion:reduce){.idle,.cloud,.car,.bub,.shoot,.wave{animation:none!important}}
</style>
</head>
<body>
<div class="top">
  <a href="dashboard.html" class="back">← <span>Dashboard</span></a>
  <h1>🎲 Gọi tên vui</h1>
  <div class="tabs" id="tabs"></div>
  <select class="ib" id="src" title="Lấy danh sách từ"></select>
  <button class="ib" id="btnList" title="Sửa danh sách">📋</button>
  <button class="ib" id="btnSnd" title="Bật/tắt âm thanh">🔊</button>
  <button class="ib" id="btnFs" title="Toàn màn hình">⛶</button>
</div>
<div class="stage" id="stage"></div>
<div class="bar">
  <button class="go" id="go">🎲 Gọi tên!</button>
  <label class="ck"><input type="checkbox" id="noRepeat" checked> Không gọi lại</label>
  <span class="cnt" id="cnt"></span>
  <button class="ib" id="btnReset">↺ Gọi lại từ đầu</button>
</div>
<div class="dlg" id="dlg" hidden>
  <div class="dlg-box">
    <h3>📋 Danh sách tự nhập</h3>
    <div class="hint">Mỗi dòng một tên (dán từ Excel được, cột STT tự bỏ qua). Danh sách này dùng khi chọn nguồn “Danh sách tự nhập”.</div>
    <textarea id="ta" placeholder="Nguyễn Văn An&#10;Trần Thị Bình&#10;…"></textarea>
    <div class="row"><button class="ib" id="dlgCancel">Hủy</button><button class="go" id="dlgOk" style="padding:9px 18px;font-size:.95rem">Lưu</button></div>
  </div>
</div>

<script>
/* ═════════ TIỆN ÍCH ═════════ */
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short=n=>{const p=n.trim().split(/\s+/);return p.length>2?p.slice(-2).join(' '):n.trim();};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a);
if(window.self!==window.top) document.body.classList.add('embed');

/* ═════════ NGUỒN DANH SÁCH ═════════ */
function sources(){
  const out=[];const cn=(store.get('cn_students',[])||[]).map(x=>(x.hoTen||'').trim()).filter(Boolean);
  const cl=store.get('cn_className','');
  if(cn.length) out.push({id:'cn',label:'Lớp chủ nhiệm'+(cl?' '+cl:''),names:cn});
  const sd=store.get('etv1_sodiem_v2',{books:[]})||{books:[]};
  (sd.books||[]).forEach(b=>{const n=((b.hk1&&b.hk1.students)||[]).map(s=>(s.ten||'').trim()).filter(Boolean);if(n.length)out.push({id:'b:'+b.id,label:`${b.mon} – ${b.lop}`,names:n});});
  out.push({id:'own',label:'Danh sách tự nhập',names:store.get('gtv_list',[])||[]});
  return out;
}
let srcId=store.get('gtv_src',null), names=[];
function loadSrc(){const S=sources();let s=S.find(x=>x.id===srcId)||S[0];srcId=s.id;names=[...new Set(s.names)];
  $('src').innerHTML=S.map(x=>`<option value="${esc(x.id)}"${x.id===srcId?' selected':''}>${esc(x.label)} (${x.names.length})</option>`).join('');}
const usedKey=()=>'gtv_used_'+srcId;
let used=new Set();
let mode=store.get('gtv_mode','ufo'), sound=store.get('gtv_sound',true), busy=false;

/* ═════════ ÂM THANH ═════════ */
let AC=null;
function tone(f,d=.15,type='sine',v=.15,slide=0){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
const win=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.16),i*120));

/* ═════════ HÌNH VẼ (tự vẽ bằng SVG) ═════════ */
const KC=['#2563eb','#0ea5e9','#7c3aed','#db2777','#059669','#ea580c','#4f46e5','#0891b2'];
const HC=['#f87171','#fb923c','#facc15','#4ade80','#60a5fa','#a78bfa','#f472b6','#2dd4bf'];

  msgs:['Gắp trúng rồi! Mời em lên bảng 🧸','Chú gấu mang tên em đã được gắp – mời em trả lời!','Máy gắp thú chọn em! 🎉']},
 rocket:{icon:'🚀',label:'Phóng tên lửa',top:.2,cls:'sky-rkt',ia:'bob',
  scene(sc,H,top){for(let i=0;i<50;i++)add(sc,'star',{left:rnd(0,100)+'%',top:rnd(0,45)+'%',animationDelay:rnd(0,3)+'s'});add(sc,'shoot');add(sc,'pad',{height:'14px'});},
  fig:i=>ROCKET(HC[(i*3+1)%8]), nmStyle:'color:#fff;background:rgba(2,6,23,.65)',slotCls:'rkt-slot',
  mover(W,cell){const m=mk('mover robot',`<div class="bubble">Kiểm tra!</div>${ROBOT}`);m.style.width=Math.max(36,Math.min(64,cell*.45))+'px';return m;},
  at(r,m){return{x:r.left+r.width*.08,y:r.bottom-m.offsetHeight}},
  park(st,m){return{x:30,y:st.height-m.offsetHeight-14}},
  async hop(s,m){m.classList.add('talk');s.classList.add('ignite');tone(160,.25,'sawtooth',.08,90);await wait(260);s.classList.remove('ignite');puffs(s,4);await wait(260);m.classList.remove('talk');},
  async final(s,m){const b=m.querySelector('.bubble');m.classList.add('talk');for(const t of ['3','2','1']){b.textContent=t+'…';tone(t==='1'?1046:784,.18,'square',.1);await wait(520);}
    b.textContent='Phóng! 🔥';s.classList.add('ignite');puffs(s,14);tone(90,1.6,'sawtooth',.18,40);await wait(300);s.querySelector('.fig').classList.remove('idle');s.classList.add('launch');await wait(1500);m.classList.remove('talk');b.textContent='Kiểm tra!';},
  msgs:['Tên lửa mang tên em đã rời bệ phóng – mời em lên bảng! 🚀','3… 2… 1… Mời em trả lời câu hỏi!','Nhiệm vụ không gian dành cho em! 🌌']}
};
function mk(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;return d;}
function add(sc,cls,st){const d=document.createElement('div');d.className='amb '+cls;if(st)Object.assign(d.style,st);sc.appendChild(d);return d;}
function beamTo(m,s){const r=s.getBoundingClientRect(),u=m.getBoundingClientRect();m.style.setProperty('--bh',Math.max(30,r.top-u.top-u.height*.7+r.height*.55)+'px');}
function lineTo(m,s,extra=0){const l=m.querySelector('.line');if(!s){l.style.setProperty('--ll','0px');return;}const r=s.getBoundingClientRect(),u=l.getBoundingClientRect();l.style.setProperty('--ll',Math.max(10,r.top-u.top+r.height*(.25+extra))+'px');}
function clawTo(m,s,extra=0){if(!s){m.style.setProperty('--ll','10px');return;}const r=s.querySelector('.fig').getBoundingClientRect(),c=m.querySelector('.cab').getBoundingClientRect(),h=m.querySelector('.hand').getBoundingClientRect();
  m.style.setProperty('--ll',Math.max(10,r.top-c.top-h.height*.55+r.height*extra)+'px');}
function puffs(s,n){const st=$('stage'),r=s.querySelector('.fig').getBoundingClientRect(),o=st.getBoundingClientRect();
  for(let i=0;i<n;i++){const d=document.createElement('i');d.className='puff';d.style.left=(r.left-o.left+r.width/2)+'px';d.style.top=(r.bottom-o.top-4)+'px';d.style.setProperty('--dx',rnd(-70,70)+'px');d.style.setProperty('--dy',rnd(-10,20)+'px');st.appendChild(d);setTimeout(()=>d.remove(),1500);}}
function burst(s,cls,n,cols){const st=$('stage'),r=s.querySelector('.fig').getBoundingClientRect(),o=st.getBoundingClientRect();
  for(let i=0;i<n;i++){const d=document.createElement('i');d.className=cls;d.style.left=(r.left-o.left+r.width/2)+'px';d.style.top=(r.top-o.top+r.height*.35)+'px';
    if(cols)d.style.background=cols[i%cols.length];const a=Math.random()*Math.PI*2,R=rnd(30,90);d.style.setProperty('--dx',Math.cos(a)*R+'px');d.style.setProperty('--dy',Math.sin(a)*R+'px');st.appendChild(d);setTimeout(()=>d.remove(),1300);}}

/* ═════════ DỰNG SÂN KHẤU ═════════ */
let slots=[],mover=null,M=MODES[mode]||MODES.ufo;
function build(){
  M=MODES[mode]||MODES.ufo;const st=$('stage');st.innerHTML='';slots=[];
  const W=st.clientWidth,H=st.clientHeight;
  const sc=document.createElement('div');sc.className='scene '+M.cls;st.appendChild(sc);
  const top=Math.max(mode==='ufo'?110:60,H*M.top);
  M.scene(sc,H,top,W);
  if(!names.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<span>Chưa có danh sách học sinh.<br>Chọn nguồn ở góc trên, hoặc bấm <b>📋</b> để dán danh sách.</span>';st.appendChild(e);mover=null;updCnt();return;}
  let best={c:1,s:0};for(let c=1;c<=names.length;c++){const r=Math.ceil(names.length/c);const s=Math.min(W*.96/c,(H-top-12)/r);if(s>best.s)best={c,s};}
  const cell=best.s,fs=Math.max(10,Math.min(18,cell*.16));
  const g=document.createElement('div');g.className='grid';Object.assign(g.style,{gridTemplateColumns:`repeat(${best.c},minmax(0,1fr))`,top:top+'px',bottom:'12px'});
  g.style.setProperty('--fs',fs+'px');g.style.setProperty('--sz',Math.min(cell*.6,mode==='ufo'?70:mode==='fish'?96:mode==='rocket'?60:88)+'px');
  names.forEach((n,i)=>{const d=document.createElement('div');d.className='slot '+(M.slotCls||'')+(used.has(n)?' used':'');
    d.innerHTML=`<div class="fig idle" style="--ia:${M.ia};--id:${rnd(1.2,2.6).toFixed(2)}s;--dl:-${rnd(0,2).toFixed(2)}s">${M.fig(i)}</div><div class="nm" style="${M.nmStyle}" title="${esc(n)}">${esc(short(n))}</div>`;
    d.dataset.name=n;g.appendChild(d);slots.push(d);});
  sc.appendChild(g);
  mover=M.mover(W,cell);sc.appendChild(mover);park(true);updCnt();
}
function place(p){const st=$('stage').getBoundingClientRect();mover.style.transform=`translate(${p.x-(mode==='fish'?0:mover.offsetWidth/2)}px,${p.y}px)`;}
function placeAt(s){const st=$('stage').getBoundingClientRect(),r=s.getBoundingClientRect();
  const rr={left:r.left-st.left,top:r.top-st.top,width:r.width,height:r.height,bottom:r.bottom-st.top};const p=M.at(rr,mover,st);
  mover.style.transform=`translate(${p.x-(mode==='fish'?0:mover.offsetWidth/2)}px,${p.y}px)`;}
function park(instant){if(!mover)return;if(instant)mover.style.transition='none';const st=$('stage').getBoundingClientRect();
  const p=M.park({width:st.width,height:st.height},mover);place(p);if(instant){mover.offsetWidth;mover.style.transition='';}}
function updCnt(){const left=names.filter(n=>!used.has(n)).length;$('cnt').textContent=names.length?`Còn ${$('noRepeat').checked?left:names.length}/${names.length} em`:'';}

/* ═════════ GỌI TÊN ═════════ */
async function call(){
  if(busy||!names.length||!mover)return;
  let pool=slots.filter(s=>!$('noRepeat').checked||!used.has(s.dataset.name));
  if(!pool.length){used.clear();store.set(usedKey(),[]);slots.forEach(s=>s.classList.remove('used'));pool=slots.slice();updCnt();}
  busy=true;$('go').disabled=true;
  const pick=pool[Math.floor(Math.random()*pool.length)];
  const hops=Math.min(8,Math.max(3,Math.round(pool.length/4)));let prev=null;
  M.start&&M.start(mover);
  for(let i=0;i<hops;i++){let s;do{s=pool[Math.floor(Math.random()*pool.length)];}while(pool.length>2&&(s===prev||s===pick));
    const d=(mode==='ufo'?560:480)+i*80;mover.style.transitionDuration=d+'ms';placeAt(s);await wait(d);
    slots.forEach(x=>x.classList.remove('hot'));s.classList.add('hot');await M.hop(s,mover);prev=s;}
  mover.style.transitionDuration='1100ms';placeAt(pick);await wait(1100);
  slots.forEach(x=>x.classList.remove('hot'));pick.classList.add('hot');
  await M.final(pick,mover);
  used.add(pick.dataset.name);store.set(usedKey(),[...used]);win();showResult(pick);
}
function showResult(pick){
  const n=pick.dataset.name,st=$('stage'),d=document.createElement('div');d.className='res';
  d.innerHTML=`<div class="res-card"><div class="res-ic">${M.icon}</div><div class="res-lb">Xin mời</div><div class="res-nm">${esc(n)}</div><div class="res-msg">${M.msgs[Math.floor(Math.random()*M.msgs.length)]}</div>
  <div class="res-btns"><button class="b1" id="again">🎲 Gọi tiếp</button><button class="b2" id="close">Đóng</button></div></div>`;
  st.appendChild(d);const C=['#f43f5e','#f59e0b','#10b981','#3b82f6','#a855f7','#fde047'];
  for(let i=0;i<70;i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'%';c.style.background=C[i%6];c.style.animationDuration=rnd(1.6,3.2)+'s';c.style.animationDelay=rnd(0,.4)+'s';st.appendChild(c);setTimeout(()=>c.remove(),3700);}
  const done=()=>{d.remove();finish(pick);};
  d.querySelector('#close').onclick=done;d.querySelector('#again').onclick=()=>{done();setTimeout(call,80);};d.onclick=e=>{if(e.target===d)done();};
}
function finish(pick){
  pick.classList.remove('abduct','open','hot','hooked','lay','grabbed','launch','ignite');pick.style.removeProperty('--lift');
  const f=pick.querySelector('.fig');f.classList.remove('pop');f.classList.add('idle');
  if($('noRepeat').checked)pick.classList.add('used');
  busy=false;$('go').disabled=false;mover.style.transitionDuration='';park();updCnt();
}

/* ═════════ ĐIỀU KHIỂN ═════════ */
$('tabs').innerHTML=Object.entries(MODES).map(([k,m])=>`<button class="tab${k===mode?' on':''}" data-m="${k}" title="${m.label}">${m.icon} <span class="l">${m.label}</span></button>`).join('');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(busy)return;mode=b.dataset.m;store.set('gtv_mode',mode);document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));build();});
function setSrc(id){srcId=id;store.set('gtv_src',id);loadSrc();used=new Set((store.get(usedKey(),[])||[]).filter(n=>names.includes(n)));build();}
$('src').onchange=e=>{if(busy){e.target.value=srcId;return;}setSrc(e.target.value);};
$('go').onclick=call;
$('btnReset').onclick=()=>{if(busy)return;used.clear();store.set(usedKey(),[]);build();};
$('noRepeat').onchange=build;
$('btnSnd').textContent=sound?'🔊':'🔇';
$('btnSnd').onclick=()=>{sound=!sound;store.set('gtv_sound',sound);$('btnSnd').textContent=sound?'🔊':'🔇';};
$('btnFs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();};
$('btnList').onclick=()=>{$('ta').value=(store.get('gtv_list',[])||[]).join('\n');$('dlg').hidden=false;$('ta').focus();};
$('dlgCancel').onclick=()=>{$('dlg').hidden=true;};
$('dlgOk').onclick=()=>{const l=[...new Set($('ta').value.split(/\r?\n/).map(s=>(s.split('\t').find(x=>x.trim()&&isNaN(x))||'').trim()).filter(Boolean))];
  store.set('gtv_list',l);$('dlg').hidden=true;setSrc('own');};
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;if(e.code==='Space'||e.key==='Enter'){e.preventDefault();const r=document.querySelector('.res #again');if(r)r.click();else call();}});
let rt;new ResizeObserver(()=>{if(busy)return;clearTimeout(rt);rt=setTimeout(build,120);}).observe($('stage'));
loadSrc();used=new Set((store.get(usedKey(),[])||[]).filter(n=>names.includes(n)));build();
</script>
